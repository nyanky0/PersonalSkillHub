<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hand Tracking Boilerplate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    color: #e8e8e8;
  }
  .container {
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 4/3;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
  }
  canvas#output {
    width: 100%; height: 100%;
    display: block;
    transform: scaleX(-1);
  }
  video#input { display: none; }
  .status {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
    padding: 0.6rem 1.2rem;
    background: rgba(10,10,15,0.9);
    border: 1px solid rgba(255,215,0,0.3);
    border-radius: 50px;
    font-size: 0.8rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #333; }
  .dot.active { background: #ffd700; box-shadow: 0 0 10px #ffd700; }
  .dot.loading { background: #ff8c00; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }
</style>
</head>
<body>

<div class="container">
  <video id="input" playsinline muted></video>
  <canvas id="output"></canvas>
</div>

<div class="status">
  <span class="dot loading" id="dot"></span>
  <span id="msg">Loading...</span>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } 
  from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.13';

const video = document.getElementById('input');
const canvas = document.getElementById('output');
const ctx = canvas.getContext('2d');
const dot = document.getElementById('dot');
const msg = document.getElementById('msg');

let landmarker = null;
let running = false;

async function init() {
  try {
    msg.textContent = 'Requesting camera...';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    msg.textContent = 'Loading model...';
    const vision = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.13/wasm'
    );

    landmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numHands: 1,
      minHandDetectionConfidence: 0.7,
      minHandPresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    dot.classList.remove('loading');
    dot.classList.add('active');
    msg.textContent = 'Ready — show your hand';

    running = true;
    requestAnimationFrame(render);
  } catch (e) {
    console.error(e);
    dot.style.background = '#ff4444';
    msg.textContent = 'Error: ' + e.message;
  }
}

function resize() {
  if (video.videoWidth) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = video.videoWidth * dpr;
    canvas.height = video.videoHeight * dpr;
    ctx.scale(dpr, dpr);
  }
}

function render(time) {
  if (!running) return;
  resize();

  // Draw mirrored video
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, -video.videoWidth, 0, video.videoWidth, video.videoHeight);
  ctx.restore();

  // Detect
  if (landmarker) {
    const results = landmarker.detectForVideo(video, performance.now());
    
    if (results.landmarks.length) {
      const lm = results.landmarks[0];
      const w = video.videoWidth, h = video.videoHeight;

      // Draw all landmarks
      ctx.fillStyle = '#00ff88';
      lm.forEach(p => {
        ctx.beginPath();
        ctx.arc(w * (1 - p.x), h * p.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      // Pinch detection (thumb tip 4 + index tip 8)
      const thumb = lm[4], index = lm[8];
      const dist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
      
      ctx.strokeStyle = dist < 0.045 ? '#ffd700' : '#00aaff';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(w * (1 - thumb.x), h * thumb.y);
      ctx.lineTo(w * (1 - index.x), h * index.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // Pinch trigger
      if (dist < 0.045) {
        const palm = lm[9];
        const cx = w * (1 - palm.x), cy = h * palm.y;
        const r = Math.min(w, h) * 0.25;
        
        // Simple circle demo
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }
  }

  requestAnimationFrame(render);
}

window.addEventListener('beforeunload', () => {
  running = false;
  if (landmarker) landmarker.close();
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
});

init();
</script>
</body>
</html>
