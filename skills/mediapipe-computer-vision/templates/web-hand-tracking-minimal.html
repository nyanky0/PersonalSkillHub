<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediaPipe Hand Tracking - Minimal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; min-height: 100vh; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui; color: #eee; }
  .container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 4/3; }
  canvas, video { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  canvas { transform: scaleX(-1); z-index: 10; }
  video { display: none; }
  .status { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); padding: 0.5rem 1rem; background: rgba(0,0,0,0.8); border-radius: 999px; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="container">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>
<div class="status" id="status">Initializing...</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.13';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

let handLandmarker = null;
let running = false;

async function init() {
  try {
    statusEl.textContent = 'Loading model...';
    const vision = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.13/wasm'
    );
    
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numHands: 1,
      minHandDetectionConfidence: 0.7,
      minHandPresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // Camera with fallback
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    if (!cams.length) throw new Error('No camera');
    
    let stream;
    const constraints = [
      { video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } },
      { video: { facingMode: 'user' } },
      { video: { deviceId: { exact: cams[0].deviceId } } }
    ];
    
    for (const c of constraints) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ ...c, audio: false });
        break;
      } catch (e) { console.warn(e.message); }
    }
    if (!stream) throw new Error('Camera access failed');

    video.srcObject = stream;
    await video.play();

    // Resize canvas to video
    const dpr = window.devicePixelRatio || 1;
    canvas.width = video.videoWidth * dpr;
    canvas.height = video.videoHeight * dpr;
    ctx.scale(dpr, dpr);
    canvas.style.width = video.videoWidth + 'px';
    canvas.style.height = video.videoHeight + 'px';

    statusEl.textContent = 'Ready — show your hand';
    running = true;
    requestAnimationFrame(loop);
  } catch (err) {
    console.error(err);
    let msg = err.message;
    if (msg.includes('NotAllowedError') || msg.includes('Permission')) msg = 'Camera blocked — click 🔒 in address bar → Allow → Refresh';
    else if (msg.includes('NotReadableError')) msg = 'Camera busy — close Zoom/Teams and refresh';
    else if (msg.includes('NotFoundError')) msg = 'No camera found';
    statusEl.textContent = 'Error: ' + msg;
  }
}

function loop(time) {
  if (!running) return;
  
  // Clear & draw mirrored video
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, -video.videoWidth, 0, video.videoWidth, video.videoHeight);
  ctx.restore();

  // Detect
  if (handLandmarker) {
    const results = handLandmarker.detectForVideo(video, performance.now());
    if (results.landmarks.length) {
      const lm = results.landmarks[0];
      
      // Draw all landmarks
      ctx.fillStyle = '#0f0';
      lm.forEach(p => {
        const x = video.videoWidth * (1 - p.x);
        const y = video.videoHeight * p.y;
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
      });
      
      // Pinch line
      const thumb = lm[4], index = lm[8];
      const dx = thumb.x - index.x, dy = thumb.y - index.y;
      const dist = Math.hypot(dx, dy);
      
      ctx.strokeStyle = dist < 0.05 ? '#ff0' : '#0af';
      ctx.lineWidth = 2;
      ctx.setLineDash([5,5]);
      ctx.beginPath();
      ctx.moveTo(video.videoWidth * (1 - thumb.x), video.videoHeight * thumb.y);
      ctx.lineTo(video.videoWidth * (1 - index.x), video.videoHeight * index.y);
      ctx.stroke();
      ctx.setLineDash([]);
      
      if (dist < 0.05) {
        statusEl.textContent = 'PINCH DETECTED! ✨';
      }
    }
  }
  
  requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
